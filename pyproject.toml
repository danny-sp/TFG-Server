[project]
name = "tfg-server"
version = "0.1.0"
description = "Program to be executed on the server side of the TFG project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.11.0",
    "geopy>=2.4.1",
    "ipykernel>=7.2.0",
    "kagglehub>=1.0.0",
    "mariadb>=1.1.14",
    "osmium>=4.3.0",
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.1",
    "polyline>=2.0.4",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "types-requests>=2.32.4.20260324",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
    "ruff>=0.15.7",
]

[tool.mypy]
python_version = "3.11"
mypy_path = ["$MYPY_CONFIG_FILE_DIR"]
namespace_packages = true
explicit_package_bases = true
plugins = [
  "pydantic.mypy",
]

[tool.pylint.messages_control]
disable = [
    "import-error",
    "logging-fstring-interpolation",
    "too-few-public-methods",
    "line-too-long",
]
